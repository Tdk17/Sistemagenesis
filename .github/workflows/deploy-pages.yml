name: Publicar Genesis no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: pages
        uses: actions/configure-pages@v5
      - name: Instalar Flutter estável
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
      - name: Compilar o painel
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: flutter build web --release --no-pub --base-href "${PAGES_BASE_PATH%/}/"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verificar o painel publicado
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 5 "${SITE_URL%/}/" -o "$RUNNER_TEMP/genesis.html"
          grep -Fq 'flutter_bootstrap.js' "$RUNNER_TEMP/genesis.html"
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 5 "${SITE_URL%/}/flutter_bootstrap.js" -o /dev/null
